<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Domain History Checker</title>

  <style>
    *{box-sizing:border-box}

    body{
      margin:0;
      font:14px system-ui;
      background:#0b1020;
      color:#eef2ff
    }

    .wrap{
      max-width:1180px;
      margin:auto;
      padding:24px
    }

    h1{
      margin:0 0 16px;
      font-size:28px
    }

    .card{
      background:#121a2e;
      border:1px solid #26324d;
      border-radius:14px;
      padding:16px;
      margin-bottom:14px
    }

    textarea{
      width:100%;
      min-height:150px;
      background:#0d1425;
      color:#fff;
      border:1px solid #33415f;
      border-radius:10px;
      padding:12px;
      resize:vertical
    }

    .bar{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      margin-top:12px
    }

    button{
      border:0;
      border-radius:9px;
      padding:10px 15px;
      font-weight:700;
      cursor:pointer
    }

    .go{
      background:#22c55e;
      color:#04130a
    }

    .stop{
      background:#ef4444;
      color:#fff
    }

    .csv{
      background:#334155;
      color:#fff
    }

    .clean{
      background:#2563eb;
      color:#fff
    }

    .muted{
      color:#94a3b8
    }

    .clean-info{
      margin-top:10px;
      font-size:13px;
      color:#93c5fd
    }

    .progress{
      height:8px;
      background:#1e293b;
      border-radius:9px;
      overflow:hidden;
      flex:1;
      min-width:160px
    }

    .progress>i{
      display:block;
      height:100%;
      width:0;
      background:#38bdf8
    }

    .table{
      overflow:auto
    }

    table{
      width:100%;
      border-collapse:collapse;
      min-width:1000px
    }

    th,td{
      padding:9px;
      border-bottom:1px solid #26324d;
      text-align:left;
      vertical-align:top
    }

    th{
      position:sticky;
      top:0;
      background:#121a2e
    }

    .ok{
      color:#86efac
    }

    .err{
      color:#fca5a5
    }

    .tag{
      display:inline-block;
      padding:3px 7px;
      border-radius:999px;
      background:#1e293b
    }

    .desc{
      max-width:420px;
      white-space:normal
    }

    .small{
      font-size:12px
    }
  </style>
</head>

<body>

<div class="wrap">

  <h1>Domain History Checker</h1>

  <div class="card">

    <textarea
      id="input"
      placeholder="Dán domain, URL hoặc dữ liệu lẫn text...
example.com
https://abc.com/page
www.test.net
text rác sẽ tự bị loại"
    ></textarea>

    <div class="bar">

      <button class="go" id="start">
        Bắt đầu quét
      </button>

      <button class="clean" id="clean">
        Làm sạch
      </button>

      <button class="stop" id="stop" disabled>
        Dừng
      </button>

      <button class="csv" id="csv">
        Xuất CSV
      </button>

      <span id="stat" class="muted">
        0 domain
      </span>

      <div class="progress">
        <i id="prog"></i>
      </div>

    </div>

    <div id="cleanInfo" class="clean-info">
      Chưa phân tích dữ liệu.
    </div>

  </div>


  <div class="card table">

    <table>

      <thead>
        <tr>
          <th>Domain</th>
          <th>Trạng thái</th>
          <th>Số năm</th>
          <th>Năm đầu</th>
          <th>Năm cuối</th>
          <th>Bản lưu</th>
          <th>Chủ đề</th>
          <th>Mô tả lịch sử</th>
        </tr>
      </thead>

      <tbody id="rows">

        <tr>
          <td colspan="8" class="muted">
            Chưa có dữ liệu.
          </td>
        </tr>

      </tbody>

    </table>

  </div>

</div>


<script>

const $ = s => document.querySelector(s);

let abort = false;
let results = [];


/* ================================
   LỌC + LÀM SẠCH DOMAIN
================================ */

function cleanDomains(raw){

  const valid = [];
  const seen = new Set();

  let invalid = 0;
  let duplicates = 0;

  if(!raw.trim()){
    return {
      domains:[],
      invalid:0,
      duplicates:0
    };
  }

  /*
    Hỗ trợ:
    - mỗi dòng một domain
    - cách nhau bằng dấu cách
    - dấu phẩy
    - tab
  */

  const tokens = raw
    .split(/[\s,;]+/)
    .map(x => x.trim())
    .filter(Boolean);


  for(let token of tokens){

    let s = token.trim();


    /* email -> lấy domain */
    if(
      /^[^@\s]+@[^@\s]+\.[^@\s]+$/i.test(s)
    ){
      s = s.split("@").pop();
    }


    /* URL đầy đủ */
    try{

      if(/^https?:\/\//i.test(s)){

        s = new URL(s).hostname;

      }

    }catch(e){}


    /*
      bỏ protocol nếu URL hơi lỗi
    */
    s = s.replace(
      /^(https?:\/\/)/i,
      ""
    );


    /*
      bỏ www.
    */
    s = s.replace(
      /^www\./i,
      ""
    );


    /*
      bỏ path
      ?query
      #hash
      port
    */
    s = s
      .split("/")[0]
      .split("?")[0]
      .split("#")[0]
      .split(":")[0];


    /*
      bỏ ký tự dư đầu/cuối
    */
    s = s
      .replace(/^[("'[\]{}<>]+/g,"")
      .replace(/[)"'\[\]{}<>,.]+$/g,"")
      .trim()
      .toLowerCase();


    /*
      regex domain

      CHỈ cần 1 dấu chấm trở lên.

      abc.com      OK
      test.net     OK
      a.b.com      OK
      abc          LOẠI
      hello123     LOẠI
    */

    const domainRe =
      /^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$/i;


    if(!domainRe.test(s)){

      invalid++;

      continue;

    }


    /*
      domain trùng
    */

    if(seen.has(s)){

      duplicates++;

      continue;

    }


    seen.add(s);
    valid.push(s);


    /*
      giới hạn an toàn
    */

    if(valid.length >= 1000){

      break;

    }

  }


  return {
    domains:valid,
    invalid,
    duplicates
  };

}


/* ================================
   CẬP NHẬT THỐNG KÊ INPUT
================================ */

function updateInputStats(){

  const info = cleanDomains(
    $("#input").value
  );

  $("#stat").textContent =
    info.domains.length + " domain";

  $("#cleanInfo").textContent =
    `Hợp lệ: ${info.domains.length} · ` +
    `Lỗi/rác: ${info.invalid} · ` +
    `Trùng: ${info.duplicates}`;

}


/* ================================
   NÚT LÀM SẠCH
================================ */

function cleanInput(){

  const info = cleanDomains(
    $("#input").value
  );


  $("#input").value =
    info.domains.join("\n");


  $("#stat").textContent =
    info.domains.length + " domain";


  $("#cleanInfo").textContent =
    `Đã giữ ${info.domains.length} domain · ` +
    `loại ${info.invalid} dòng lỗi/rác · ` +
    `loại ${info.duplicates} domain trùng`;

}


/* ================================
   ESCAPE HTML
================================ */

function esc(s=""){

  return String(s).replace(
    /[&<>"']/g,
    m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[m])
  );

}


/* ================================
   VẼ BẢNG
================================ */

function draw(){

  const body = $("#rows");


  if(!results.length){

    body.innerHTML =
      `<tr>
        <td colspan="8" class="muted">
          Chưa có dữ liệu.
        </td>
      </tr>`;

    return;

  }


  body.innerHTML =
    results.map(r => `

      <tr>

        <td>

          <a
            style="color:#7dd3fc"
            target="_blank"
            href="https://web.archive.org/web/*/${esc(r.domain)}"
          >

            ${esc(r.domain)}

          </a>

        </td>


        <td class="${r.error ? "err" : "ok"}">

          ${r.error ? "Lỗi" : "Xong"}

        </td>


        <td>
          ${esc(r.years ?? "—")}
        </td>


        <td>
          ${esc(r.firstYear ?? "—")}
        </td>


        <td>
          ${esc(r.lastYear ?? "—")}
        </td>


        <td>
          ${esc(r.totalSnapshots ?? 0)}
        </td>


        <td>

          <span class="tag">

            ${esc(r.topic ?? "Không rõ")}

          </span>

        </td>


        <td class="desc small">

          ${esc(
            r.description ??
            r.error ??
            ""
          )}

        </td>

      </tr>

    `).join("");

}


/* ================================
   GỌI API
================================ */

async function scanOne(domain){

  const res = await fetch(

    "/api/scan?domain=" +
    encodeURIComponent(domain),

    {
      cache:"no-store"
    }

  );


  const data = await res.json();


  if(!res.ok){

    throw new Error(
      data.error || "Scan lỗi"
    );

  }


  return data;

}


/* ================================
   QUÉT DOMAIN
================================ */

async function run(){

  /*
    tự làm sạch trước khi quét
  */

  const clean = cleanDomains(
    $("#input").value
  );


  const ds = clean.domains;


  if(!ds.length){

    $("#cleanInfo").textContent =
      "Không tìm thấy domain hợp lệ.";

    return;

  }


  /*
    cập nhật textarea chỉ còn domain sạch
  */

  $("#input").value =
    ds.join("\n");


  $("#cleanInfo").textContent =
    `Đã giữ ${ds.length} domain · ` +
    `loại ${clean.invalid} dòng lỗi/rác · ` +
    `loại ${clean.duplicates} domain trùng`;


  abort = false;

  results = [];

  draw();


  $("#start").disabled = true;
  $("#clean").disabled = true;
  $("#stop").disabled = false;


  $("#prog").style.width = "0%";


  let done = 0;


  /*
    chạy 5 domain cùng lúc
  */

  const concurrency = 5;


  const workers =
    Array.from(
      {
        length:Math.min(
          concurrency,
          ds.length
        )
      },

      async (_,wi)=>{

        for(
          let i=wi;
          i<ds.length && !abort;
          i+=concurrency
        ){

          const d = ds[i];


          try{

            results.push(
              await scanOne(d)
            );

          }catch(e){

            results.push({
              domain:d,
              error:e.message
            });

          }


          done++;


          $("#stat").textContent =
            `${done}/${ds.length}`;


          $("#prog").style.width =
            Math.round(
              done / ds.length * 100
            ) + "%";


          draw();

        }

      }
    );


  await Promise.all(workers);


  $("#start").disabled = false;
  $("#clean").disabled = false;
  $("#stop").disabled = true;


  if(abort){

    $("#stat").textContent =
      `Đã dừng ${done}/${ds.length}`;

  }else{

    $("#stat").textContent =
      `Hoàn tất ${done}/${ds.length}`;

  }

}


/* ================================
   BUTTON
================================ */

$("#start").onclick = run;


$("#clean").onclick =
  cleanInput;


$("#stop").onclick = ()=>{

  abort = true;

  $("#stop").disabled = true;

};


$("#input").oninput =
  updateInputStats;


/* ================================
   CSV
================================ */

$("#csv").onclick = ()=>{

  if(!results.length){
    return;
  }


  const h = [
    "domain",
    "years",
    "firstYear",
    "lastYear",
    "totalSnapshots",
    "topic",
    "description"
  ];


  const csv = [

    h.join(",")

  ].concat(

    results.map(
      r => h.map(
        k => JSON.stringify(
          r[k] ?? ""
        )
      ).join(",")
    )

  ).join("\n");


  /*
    BOM để Excel đọc tiếng Việt chuẩn
  */

  const blob = new Blob(

    [
      "\uFEFF",
      csv
    ],

    {
      type:"text/csv;charset=utf-8"
    }

  );


  const a =
    document.createElement("a");


  a.href =
    URL.createObjectURL(blob);


  a.download =
    "domain-history.csv";


  a.click();


  URL.revokeObjectURL(
    a.href
  );

};

</script>

</body>
</html>
