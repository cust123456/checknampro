<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Domain History Checker</title>

<style>
*{
  box-sizing:border-box
}

body{
  margin:0;
  font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#0b1020;
  color:#eef2ff
}

.wrap{
  max-width:1180px;
  margin:auto;
  padding:24px
}

h1{
  margin:0 0 16px;
  font-size:28px
}

.card{
  background:#121a2e;
  border:1px solid #26324d;
  border-radius:14px;
  padding:16px;
  margin-bottom:14px
}

textarea{
  width:100%;
  min-height:150px;
  background:#0d1425;
  color:#fff;
  border:1px solid #33415f;
  border-radius:10px;
  padding:12px;
  resize:vertical;
  font-family:Consolas,monospace
}

.bar{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
  margin-top:12px
}

button{
  border:0;
  border-radius:9px;
  padding:10px 15px;
  font-weight:700;
  cursor:pointer
}

button:disabled{
  opacity:.5;
  cursor:not-allowed
}

.go{
  background:#22c55e;
  color:#04130a
}

.stop{
  background:#ef4444;
  color:white
}

.csv{
  background:#334155;
  color:white
}

.clean{
  background:#2563eb;
  color:white
}

.muted{
  color:#94a3b8
}

.clean-info{
  margin-top:10px;
  font-size:13px;
  color:#93c5fd
}

.progress{
  height:8px;
  background:#1e293b;
  border-radius:9px;
  overflow:hidden;
  flex:1;
  min-width:160px
}

.progress i{
  display:block;
  height:100%;
  width:0;
  background:#38bdf8;
  transition:width .2s
}

.table{
  overflow:auto
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1050px
}

th,td{
  padding:10px;
  border-bottom:1px solid #26324d;
  text-align:left;
  vertical-align:top
}

th{
  position:sticky;
  top:0;
  background:#121a2e;
  white-space:nowrap
}

.ok{
  color:#86efac
}

.err{
  color:#fca5a5
}

.wait{
  color:#facc15
}

.tag{
  display:inline-block;
  padding:3px 7px;
  border-radius:999px;
  background:#1e293b;
  white-space:nowrap
}

.desc{
  max-width:430px;
  white-space:normal
}

.small{
  font-size:12px
}

.domain-link{
  color:#7dd3fc
}

.counter{
  white-space:nowrap
}
</style>
</head>

<body>

<div class="wrap">

<h1>Domain History Checker</h1>

<div class="card">

<textarea
  id="input"
  placeholder="Dán domain, URL hoặc dữ liệu lẫn text...

example.com
https://abc.com/page
www.test.net

Text rác, URL path và domain trùng sẽ tự bị loại."
></textarea>

<div class="bar">

<button class="go" id="start">
  Bắt đầu quét
</button>

<button class="clean" id="clean">
  Làm sạch
</button>

<button class="stop" id="stop" disabled>
  Dừng
</button>

<button class="csv" id="csv">
  Xuất CSV
</button>

<span id="stat" class="muted counter">
  0 domain
</span>

<div class="progress">
  <i id="prog"></i>
</div>

</div>

<div id="cleanInfo" class="clean-info">
  Chưa phân tích dữ liệu.
</div>

</div>


<div class="card table">

<table>

<thead>
<tr>
  <th>Domain</th>
  <th>Trạng thái</th>
  <th>Số năm</th>
  <th>Năm đầu</th>
  <th>Năm cuối</th>
  <th>Bản lưu</th>
  <th>Chủ đề</th>
  <th>Mô tả lịch sử</th>
</tr>
</thead>

<tbody id="rows">

<tr>
  <td colspan="8" class="muted">
    Chưa có dữ liệu.
  </td>
</tr>

</tbody>

</table>

</div>

</div>


<script>

const $ = s => document.querySelector(s);

let abortScan = false;
let results = [];


/* ========================================
   LỌC DOMAIN
======================================== */

function cleanDomains(raw){

  const valid = [];
  const seen = new Set();

  let invalid = 0;
  let duplicates = 0;

  if(!raw || !raw.trim()){
    return {
      domains:[],
      invalid:0,
      duplicates:0
    };
  }

  const tokens = raw
    .split(/[\s,;]+/)
    .map(x => x.trim())
    .filter(Boolean);

  for(let token of tokens){

    let s = token.trim();

    /*
      email:
      abc@example.com
      =>
      example.com
    */
    if(/^[^@\s]+@[^@\s]+\.[^@\s]+$/i.test(s)){
      s = s.split("@").pop();
    }


    /*
      URL đầy đủ
    */
    try{

      if(/^https?:\/\//i.test(s)){
        s = new URL(s).hostname;
      }

    }catch(e){}


    /*
      làm sạch
    */
    s = s
      .replace(/^https?:\/\//i,"")
      .replace(/^www\./i,"")
      .split("/")[0]
      .split("?")[0]
      .split("#")[0]
      .split(":")[0]
      .trim()
      .toLowerCase();


    /*
      bỏ ký tự thừa đầu/cuối
    */
    s = s
      .replace(/^[("'{}\[\]<>]+/g,"")
      .replace(/[)"'{}\[\]<>,.]+$/g,"");


    /*
      Domain hợp lệ:

      abc.com
      abc.info
      sub.abc.com
      abc.co.uk

      Không còn yêu cầu 2 dấu chấm
    */
    const domainRe =
      /^(?=.{1,253}$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$/i;


    if(!domainRe.test(s)){
      invalid++;
      continue;
    }


    if(seen.has(s)){
      duplicates++;
      continue;
    }


    seen.add(s);
    valid.push(s);


    /*
      giới hạn 1000 domain
    */
    if(valid.length >= 1000){
      break;
    }

  }


  return {
    domains:valid,
    invalid,
    duplicates
  };

}


/* ========================================
   THỐNG KÊ INPUT
======================================== */

function updateInputStats(){

  const info = cleanDomains(
    $("#input").value
  );

  $("#stat").textContent =
    `${info.domains.length} domain`;

  $("#cleanInfo").textContent =
    `Hợp lệ: ${info.domains.length} · ` +
    `Lỗi/rác: ${info.invalid} · ` +
    `Trùng: ${info.duplicates}`;
}


/* ========================================
   LÀM SẠCH
======================================== */

function cleanInput(){

  const info = cleanDomains(
    $("#input").value
  );

  $("#input").value =
    info.domains.join("\n");

  $("#stat").textContent =
    `${info.domains.length} domain`;

  $("#cleanInfo").textContent =
    `Đã giữ ${info.domains.length} domain · ` +
    `loại ${info.invalid} dòng lỗi/rác · ` +
    `loại ${info.duplicates} domain trùng`;
}


/* ========================================
   ESCAPE
======================================== */

function esc(s=""){

  return String(s).replace(
    /[&<>"']/g,
    m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[m])
  );
}


/* ========================================
   VẼ BẢNG
======================================== */

function draw(){

  const body = $("#rows");

  if(!results.length){

    body.innerHTML = `
      <tr>
        <td colspan="8" class="muted">
          Chưa có dữ liệu.
        </td>
      </tr>
    `;

    return;
  }


  body.innerHTML = results.map(r => {

    let statusText = "Xong";
    let statusClass = "ok";

    if(r.status === "checking"){
      statusText = "Đang quét...";
      statusClass = "wait";
    }

    if(r.error){
      statusText = "Lỗi";
      statusClass = "err";
    }


    return `
      <tr>

        <td>
          <a
            class="domain-link"
            target="_blank"
            href="https://web.archive.org/web/*/${esc(r.domain)}"
          >
            ${esc(r.domain)}
          </a>
        </td>

        <td class="${statusClass}">
          ${statusText}
        </td>

        <td>
          ${esc(r.years ?? "—")}
        </td>

        <td>
          ${esc(r.firstYear ?? "—")}
        </td>

        <td>
          ${esc(r.lastYear ?? "—")}
        </td>

        <td>
          ${esc(r.totalSnapshots ?? 0)}
        </td>

        <td>
          <span class="tag">
            ${esc(r.topic ?? "Không rõ")}
          </span>
        </td>

        <td class="desc small">
          ${esc(
            r.description ??
            r.error ??
            ""
          )}
        </td>

      </tr>
    `;

  }).join("");
}


/* ========================================
   API
======================================== */

async function scanOne(domain){

  const controller = new AbortController();

  // Render Free có thể mất thời gian khởi động
  const timeout = setTimeout(
    () => controller.abort(),
    60000
  );

  try{

    const API_URL =
      "https://checknampro-api.onrender.com/scan?domain=" +
      encodeURIComponent(domain);

    const res = await fetch(
      API_URL,
      {
        method:"GET",
        cache:"no-store",
        signal:controller.signal,
        headers:{
          "Accept":"application/json"
        }
      }
    );

    const text = await res.text();

    let data;

    try{
      data = JSON.parse(text);
    }catch{
      throw new Error(
        `API trả dữ liệu không hợp lệ (${res.status})`
      );
    }

    if(!res.ok){
      throw new Error(
        data.error ||
        `API lỗi ${res.status}`
      );
    }

    const first = data.first || {};
    const last = data.last || {};

    const firstYear =
      first.year ||
      (first.timestamp
        ? String(first.timestamp).slice(0,4)
        : "—");

    const lastYear =
      last.year ||
      (last.timestamp
        ? String(last.timestamp).slice(0,4)
        : "—");

    let years = "—";

    if(
      firstYear !== "—" &&
      lastYear !== "—" &&
      !isNaN(Number(firstYear)) &&
      !isNaN(Number(lastYear))
    ){
      years =
        Math.max(
          0,
          Number(lastYear) - Number(firstYear)
        ) + " năm";
    }

    let description = data.description || "";

    if(!description){

      const parts = [];

      if(firstYear !== "—"){
        parts.push(
          "Đầu " +
          firstYear +
          ": " +
          (first.title || first.topic || "Không rõ")
        );
      }

      if(lastYear !== "—"){
        parts.push(
          "Cuối " +
          lastYear +
          ": " +
          (last.title || last.topic || "Không rõ")
        );
      }

      description = parts.join(" | ");
    }

    return {
      domain:data.domain || domain,
      hasHistory:data.hasHistory ?? true,
      years,
      firstYear,
      lastYear,
      totalSnapshots:data.totalSnapshots ?? (
        data.hasHistory === false ? 0 : 2
      ),
      topic:
        data.topic ||
        last.topic ||
        first.topic ||
        "Khác/Không rõ",
      description,
      first,
      last
    };

  }catch(e){

    if(e.name === "AbortError"){
      throw new Error(
        "Render/Wayback phản hồi quá 60 giây"
      );
    }

    if(
      e instanceof TypeError &&
      /fetch/i.test(e.message)
    ){
      throw new Error(
        "Không kết nối được API Render hoặc bị CORS"
      );
    }

    throw e;

  }finally{

    clearTimeout(timeout);

  }
}


/* ========================================
   UPDATE 1 DÒNG
======================================== */

function updateResult(domain,data){

  const index =
    results.findIndex(
      x => x.domain === domain
    );

  if(index === -1){
    results.push(data);
  }else{
    results[index] = {
      ...results[index],
      ...data
    };
  }

}


/* ========================================
   QUÉT
======================================== */

async function run(){

  const clean =
    cleanDomains(
      $("#input").value
    );

  const ds =
    clean.domains;


  if(!ds.length){

    $("#cleanInfo").textContent =
      "Không tìm thấy domain hợp lệ.";

    return;
  }


  /*
    thay textarea bằng danh sách sạch
  */
  $("#input").value =
    ds.join("\n");


  $("#cleanInfo").textContent =
    `Đã giữ ${ds.length} domain · ` +
    `loại ${clean.invalid} dòng lỗi/rác · ` +
    `loại ${clean.duplicates} domain trùng`;


  abortScan = false;


  /*
    tạo sẵn toàn bộ dòng
  */
  results = ds.map(domain => ({
    domain,
    status:"waiting",
    years:"—",
    firstYear:"—",
    lastYear:"—",
    totalSnapshots:0,
    topic:"Chờ quét",
    description:""
  }));


  draw();


  $("#start").disabled = true;
  $("#clean").disabled = true;
  $("#stop").disabled = false;


  $("#prog").style.width =
    "0%";


  let done = 0;


  /*
    QUAN TRỌNG:
    chỉ quét 2 domain song song
    để hạn chế Wayback chặn
  */
  const concurrency = 2;


  async function worker(workerIndex){

    for(
      let i = workerIndex;
      i < ds.length;
      i += concurrency
    ){

      if(abortScan){
        break;
      }


      const domain =
        ds[i];


      updateResult(domain,{
        status:"checking",
        topic:"Đang kiểm tra"
      });


      draw();


      try{

        const data =
          await scanOne(domain);


        updateResult(domain,{
          ...data,
          status:"complete",
          error:null
        });


      }catch(e){

        updateResult(domain,{
          status:"complete",
          error:e.message,
          topic:"Lỗi",
          description:e.message
        });

      }


      done++;


      $("#stat").textContent =
        `${done}/${ds.length}`;


      $("#prog").style.width =
        Math.round(
          done / ds.length * 100
        ) + "%";


      draw();


      /*
        nghỉ nhẹ trước request kế
      */
      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            350 + Math.random()*400
          )
      );

    }

  }


  const workers = [];

  for(
    let i=0;
    i<Math.min(concurrency,ds.length);
    i++
  ){
    workers.push(worker(i));
  }


  await Promise.all(workers);


  $("#start").disabled = false;
  $("#clean").disabled = false;
  $("#stop").disabled = true;


  if(abortScan){

    $("#stat").textContent =
      `Đã dừng ${done}/${ds.length}`;

  }else{

    $("#stat").textContent =
      `Hoàn tất ${done}/${ds.length}`;

  }

}


/* ========================================
   BUTTON
======================================== */

$("#start").addEventListener(
  "click",
  run
);


$("#clean").addEventListener(
  "click",
  cleanInput
);


$("#stop").addEventListener(
  "click",
  () => {

    abortScan = true;

    $("#stop").disabled = true;

  }
);


$("#input").addEventListener(
  "input",
  updateInputStats
);


/* ========================================
   CSV
======================================== */

$("#csv").addEventListener(
  "click",
  () => {

    if(!results.length){
      alert("Chưa có dữ liệu để xuất.");
      return;
    }


    const headers = [
      "domain",
      "years",
      "firstYear",
      "lastYear",
      "totalSnapshots",
      "topic",
      "description",
      "error"
    ];


    const lines = [
      headers.join(",")
    ];


    for(const r of results){

      lines.push(
        headers.map(
          key =>
            JSON.stringify(
              r[key] ?? ""
            )
        ).join(",")
      );

    }


    const csv =
      lines.join("\n");


    const blob =
      new Blob(
        [
          "\uFEFF",
          csv
        ],
        {
          type:"text/csv;charset=utf-8"
        }
      );


    const url =
      URL.createObjectURL(blob);


    const a =
      document.createElement("a");


    a.href = url;

    a.download =
      `domain-history-${Date.now()}.csv`;


    document.body.appendChild(a);

    a.click();

    a.remove();


    setTimeout(
      () =>
        URL.revokeObjectURL(url),
      1000
    );

  }
);

</script>

</body>
</html>
